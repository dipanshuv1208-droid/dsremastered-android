name: Build Android Vulkan smoke-test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Find Android project
        id: project
        run: |
          echo "Repository contents:"
          ls -la

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/settings.gradle ] || [ -f app/settings.gradle.kts ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle."
            find . -maxdepth 5 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-device-check-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
